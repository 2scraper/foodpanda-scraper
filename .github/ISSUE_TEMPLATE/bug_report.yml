name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Everything exit 3?** Check whether the run was **headless**
          before you check anything else. This site refuses a headless
          browser: measured 0 of 4 headless navigations served (HTTP 403 every
          time) against 4 of 4 with a real window. `--headful` is the default
          here, and `--cdp-endpoint` is the other path measured to work.
        - **Exit 3 some of the time?** PerimeterX's refusal is a matter of
          degree and a property of the session. Let `--retries` work (each
          attempt is a fresh browser), and raise `--retry-delay` and
          `--delay`. See [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **Zero rows?** You may be on a directory rather than a listing —
          `/city` and `/city/{city}/area` list links, not vendors — or one
          page past the end of a listing. Both are exit 4 and correct
          answers.
        - **`review_count` stuck at 100, or `discount_pct` too high?** Read
          `review_count_is_floor` and `discount_is_upper_bound`. The site
          prints `(100+)` and `Up to 35% off`.
        - **`delivery_fee`, `delivery_time`, `price_level` null on every
          row?** Those are published on the country home page only;
          `page_kind` says which page you scraped.
        - **Two runs disagree about many rows?** That is `is_open`, a
          point-in-time reading, and the clock.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        challenge page, 4 is "ran fine, found nothing", 124 is a self-imposed
        timeout. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --url "https://www.foodpanda.pk/city/lahore/area/gulberg" \
          --pages 3
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        48 vendors per page, as the README says a city listing yields.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
